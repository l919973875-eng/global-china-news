name: 全球广义涉华新闻云端抓取

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron uses UTC. This runs every 6 hours at minute 17.
    # Beijing time: 02:17 / 08:17 / 14:17 / 20:17.
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'cloud_runner.py'
      - 'requirements.txt'
      - 'config/**'
      - '.github/workflows/cloud-crawl.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: global-china-news-cloud
  cancel-in-progress: false

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
      ENABLE_GDELT: 'true'
      GDELT_TIMESPAN: '1d'
      RETENTION_DAYS: '45'
      MAX_STORED_ARTICLES: '50000'
      SITE_MAX_ARTICLES: '20000'
      MAX_ARTICLES_PER_SOURCE: '80'
      FETCH_TIMEOUT_SECONDS: '18'
      CONCURRENCY: '18'

    steps:
      - name: 读取项目
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: 准备 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装依赖
        run: python -m pip install -r requirements.txt

      - name: 运行自检
        run: python cloud_runner.py --self-test

      - name: 抓取全部来源并筛选广义涉华新闻
        run: python cloud_runner.py

      - name: 保存历史数据到仓库
        shell: bash
        run: |
          git config user.name "global-china-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "没有新的持久化数据"
          else
            git commit -m "data: update global China-related news"
            git push
          fi

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传网页
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

      - name: 发布 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
